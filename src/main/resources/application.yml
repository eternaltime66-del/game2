server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: 000_Work_Demo
  task:
    execution:
      pool:
        core-size: 10       # 核心10线程
        max-size: 20        # 最大20线程
        queue-capacity: 500 # 队列缓冲
    scheduling:
      pool:
        size: 4
      thread-name-prefix: schedule-
      shutdown:
        await-termination: true
        await-termination-period: 60s
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/game2?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&autoReconnect=true&rewriteBatchedStatements=true&&socketTimeout=60000&connectTimeout=3000
    username: root
    password: 123456

  data:
    redis:
      host: 127.0.0.1
      database: 0
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: #org.apache.ibatis.logging.stdout.StdOutImpl

  global-config:
    banner: false
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

#logging:
#  level:
#    org.wx: DEBUG

wx:
  recharge-watch:
    enabled: false

