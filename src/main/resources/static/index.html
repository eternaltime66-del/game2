<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>游戏首页</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/home.css">
  <script src="/js/dev-live.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="page home-page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="home-header">
    <h1>PVE</h1>
    <button @click="logout">退出</button>
  </div>

  <div class="home-scene">
    <div v-if="loading" class="loading-text">加载中...</div>
    <div v-else class="hero-actor" @click="showDetail = true">
      <div class="hero-body">
        <div class="hero-head"></div>
      </div>
      <div class="hero-label">{{ hero.name || '主角' }}</div>
      <div class="hero-tip">点击查看详情</div>
    </div>
  </div>

  <div class="stage-panel" v-if="!loading">
    <div class="stage-panel-head">
      <h2>选关</h2>
      <span class="muted" v-if="selectedStage">已选 {{ selectedStage.displayCode }}</span>
    </div>
    <div class="stage-grid">
      <button
        v-for="stage in stages"
        :key="stage.id"
        class="stage-chip"
        :class="{ active: selectedStageId === stage.id }"
        @click="selectStage(stage)"
      >
        <span class="stage-chip-code">{{ stage.displayCode }}</span>
        <span class="stage-chip-name">{{ stage.name }}</span>
        <span class="stage-chip-waves">{{ stage.waveCount }} 波</span>
      </button>
    </div>
    <button
      class="battle-start-btn"
      :disabled="!selectedStageId"
      @click="startBattle"
    >开始战斗</button>
  </div>

  <div v-if="showDetail && hero" class="modal-mask" @click.self="showDetail = false">
    <div class="modal-card">
      <h2 class="modal-title">{{ hero.name }}</h2>
      <div class="stat-list">
        <div class="stat-row" v-for="item in statRows" :key="item.label">
          <span>{{ item.label }}</span>
          <span>{{ item.value }}</span>
        </div>
      </div>
      <button class="modal-close" @click="showDetail = false">关闭</button>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      loading: true,
      showDetail: false,
      hero: null,
      stages: [],
      selectedStageId: localStorage.getItem(APP_CONFIG.selectedStageKey) || '',
      toast: { show: false, text: '', type: 'error' }
    };
  },
  computed: {
    statRows() {
      if (!this.hero) return [];
      return [
        { label: '攻击力', value: String(this.hero.attack) },
        { label: '生命值', value: this.hero.hp + '/' + this.hero.maxHp },
        { label: '行动值', value: String(this.hero.actionValue) }
      ];
    },
    selectedStage() {
      return this.stages.find((s) => s.id === this.selectedStageId) || null;
    }
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = APP_CONFIG.loginPage;
      return;
    }
    this.loadHero();
    this.loadStages();
  },
  methods: {
    showToast(text, type) {
      this.toast = { show: true, text, type: type || 'error' };
      setTimeout(() => { this.toast.show = false; }, 2200);
    },
    loadHero() {
      GameApi.getHeroInfo()
        .then((res) => {
          this.hero = res.data;
        })
        .catch((err) => this.showToast(err.message))
        .finally(() => { this.loading = false; });
    },
    loadStages() {
      GameApi.getStageSelectList('chapter_main')
        .then((res) => {
          this.stages = res.data || [];
          if (!this.selectedStageId && this.stages.length) {
            this.selectStage(this.stages[0], false);
          }
        })
        .catch((err) => this.showToast(err.message));
    },
    selectStage(stage, showTip) {
      if (showTip === undefined) showTip = true;
      this.selectedStageId = stage.id;
      localStorage.setItem(APP_CONFIG.selectedStageKey, stage.id);
      if (showTip) {
        this.showToast('已选择 ' + stage.displayCode, 'success');
      }
    },
    startBattle() {
      if (!this.selectedStageId) {
        this.showToast('请先选择关卡');
        return;
      }
      location.href = APP_CONFIG.battlePage + '?stageId=' + encodeURIComponent(this.selectedStageId);
    },
    logout() {
      GameApi.clearToken();
      location.href = APP_CONFIG.loginPage;
    }
  }
}).mount('#app');
</script>
</body>
</html>
