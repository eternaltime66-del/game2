<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>忘记密码</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/dev-live.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="brand">
    <div class="brand-badge">G</div>
    <h1>重置密码</h1>
    <p>通过邮箱验证码设置新密码</p>
  </div>

  <div class="card">
    <div class="field">
      <label>邮箱</label>
      <div class="input-wrap">
        <input v-model.trim="form.email" type="email" placeholder="请输入注册邮箱" autocomplete="email">
      </div>
    </div>

    <div class="field">
      <label>验证码</label>
      <div class="input-wrap">
        <input v-model.trim="form.emsCode" type="text" maxlength="6" placeholder="请输入验证码" inputmode="numeric">
        <button class="code-btn" :disabled="countdown > 0 || sendingCode" @click="sendCode">
          {{ countdown > 0 ? countdown + 's' : '获取验证码' }}
        </button>
      </div>
    </div>

    <div class="field">
      <label>新密码</label>
      <div class="input-wrap">
        <input v-model="form.psd" type="password" placeholder="请设置新密码（至少6位）" autocomplete="new-password">
      </div>
    </div>

    <div class="field">
      <label>确认新密码</label>
      <div class="input-wrap">
        <input v-model="form.psdAgain" type="password" placeholder="请再次输入新密码" autocomplete="new-password">
      </div>
    </div>

    <button class="btn-primary" :disabled="loading" @click="submit">
      {{ loading ? '提交中...' : '确认重置' }}
    </button>

    <div class="links">
      <a href="/login.html">返回登录</a>
      <span></span>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      loading: false,
      sendingCode: false,
      countdown: 0,
      timer: null,
      form: {
        email: '',
        emsCode: '',
        psd: '',
        psdAgain: ''
      },
      toast: {
        show: false,
        text: '',
        type: 'error'
      }
    };
  },
  beforeUnmount() {
    if (this.timer) clearInterval(this.timer);
  },
  methods: {
    showToast(text, type) {
      this.toast = { show: true, text, type: type || 'error' };
      setTimeout(() => { this.toast.show = false; }, 2200);
    },
    validateEmail() {
      if (!this.form.email) {
        this.showToast('请输入邮箱');
        return false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(this.form.email)) {
        this.showToast('邮箱格式不正确');
        return false;
      }
      return true;
    },
    startCountdown() {
      this.countdown = 60;
      this.timer = setInterval(() => {
        this.countdown -= 1;
        if (this.countdown <= 0) {
          clearInterval(this.timer);
          this.timer = null;
        }
      }, 1000);
    },
    sendCode() {
      if (!this.validateEmail() || this.countdown > 0) return;
      this.sendingCode = true;
      GameApi.sendEmailCode(this.form.email)
        .then(() => {
          this.showToast('验证码已发送', 'success');
          this.startCountdown();
        })
        .catch((err) => this.showToast(err.message))
        .finally(() => { this.sendingCode = false; });
    },
    submit() {
      if (!this.validateEmail()) return;
      if (!this.form.emsCode) {
        this.showToast('请输入验证码');
        return;
      }
      if (!this.form.psd || this.form.psd.length < 6) {
        this.showToast('密码至少6位');
        return;
      }
      if (this.form.psd !== this.form.psdAgain) {
        this.showToast('两次密码不一致');
        return;
      }

      this.loading = true;
      GameApi.emailForget(this.form.email, this.form.emsCode, this.form.psd, this.form.psdAgain)
        .then(() => {
          this.showToast('密码重置成功', 'success');
          setTimeout(() => { location.href = APP_CONFIG.loginPage; }, 700);
        })
        .catch((err) => this.showToast(err.message))
        .finally(() => { this.loading = false; });
    }
  }
}).mount('#app');
</script>
</body>
</html>
