<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>加载中</title>
  <link rel="stylesheet" href="/css/auth.css">
  <script src="/js/dev-live.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    .loading-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
    }
    .loading-spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #7c5cff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 18px; font-weight: 600; margin: 0; }
    .loading-sub { color: rgba(255,255,255,0.65); font-size: 13px; margin: 0; max-width: 280px; line-height: 1.5; }
    .loading-err { color: #ff8b8b; font-size: 13px; }
  </style>
</head>
<body>
<div id="app" class="page">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>
  <div class="loading-page">
    <div class="loading-spinner"></div>
    <h1 class="loading-title">{{ title }}</h1>
    <p class="loading-sub">{{ message }}</p>
    <p v-if="error" class="loading-err">{{ error }}</p>
    <button v-if="error" class="btn-primary" style="margin-top:8px;width:auto;padding:10px 20px" @click="runSync">重试</button>
  </div>
</div>
<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      title: '正在加载中',
      message: '正在同步角色基础数值与装备属性…',
      error: ''
    };
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = APP_CONFIG.loginPage;
      return;
    }
    this.runSync();
  },
  methods: {
    runSync() {
      this.error = '';
      this.title = '正在加载中';
      this.message = '正在同步角色基础数值与装备属性…';
      GameApi.syncCharacters()
        .then(function () {
          location.href = APP_CONFIG.homePage;
        })
        .catch(function (err) {
          this.error = (err && err.message) || '同步失败';
          this.title = '加载失败';
          this.message = '角色数据同步未完成，请重试';
        }.bind(this));
    }
  }
}).mount('#app');
</script>
</body>
</html>
