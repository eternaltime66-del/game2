<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>战斗</title>
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/battle.css">
  <script src="/js/dev-live.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
<div id="app" class="page battle-page" :class="{ 'is-animating': animating }">
  <div class="bg-glow bg-glow-1"></div>
  <div class="bg-glow bg-glow-2"></div>

  <div class="battle-header">
    <div>
      <h1>战斗</h1>
      <div class="stage-info" v-if="battle">{{ battle.displayCode }} · {{ battle.stageName }}</div>
    </div>
    <button @click="goHome">返回</button>
  </div>

  <div v-if="loading && !battle" class="loading-text">加载中...</div>

  <template v-else-if="battle">
    <div class="battle-meta">
      <span>波次 {{ battle.currentWave }}/{{ battle.totalWaves }}</span>
      <span>状态 {{ statusText }}</span>
    </div>

    <div class="loot-bar" v-if="lootList.length">
      <span class="loot-bar-label">获得</span>
      <div class="loot-bar-scroll">
        <div
          v-for="item in lootList"
          :key="item.itemId"
          class="loot-mini"
          :title="item.itemName + ' x' + item.quantity"
        >
          <img v-if="itemIconIsImage(item.icon)" class="loot-mini-img" :src="item.icon" :alt="item.itemName">
          <span v-else class="loot-mini-icon">{{ item.icon || '📦' }}</span>
          <span class="loot-mini-qty">×{{ item.quantity }}</span>
        </div>
      </div>
      <span v-if="!animating && battle.status === 'WIN' && battle.lootGranted" class="loot-bar-badge">已入库</span>
    </div>

    <div v-if="!animating && battle.status === 'WIN'" class="battle-result win">胜利</div>
    <div v-else-if="!animating && battle.status === 'LOSE'" class="battle-result lose">失败</div>

    <div class="battle-scene">
      <div
        v-if="monsterUnits.length"
        class="monster-grid"
        :class="'monster-count-' + monsterLayoutCount"
      >
        <div
          v-for="unit in monsterUnits"
          :key="unit.unitId"
          class="battle-unit-wrap"
        >
          <div
            class="battle-unit monster compact clickable"
            :class="unitClasses(unit)"
            @click="openMonsterDetail(unit)"
          >
            <div class="unit-head">
              <span class="unit-name">{{ unit.name }}</span>
              <span class="unit-side">怪物</span>
            </div>
            <div class="bar-row">
              <div class="bar-label">
                <span>生命</span>
                <span>{{ fmtBattleHp(unit.hp) }}/{{ unit.maxHp }}</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill hp" :style="{ width: hpPercent(unit) + '%' }"></div>
              </div>
            </div>
            <div class="bar-row">
              <div class="bar-label">
                <span>行动条</span>
                <span>{{ Math.round(unit.actionBar) }}/{{ unit.actionValue }}</span>
              </div>
              <div class="bar-track action-track">
                <div
                  class="bar-fill action"
                  :class="actionBarClasses(unit)"
                  :style="{ width: actionPercent(unit) + '%' }"
                ></div>
              </div>
            </div>
          </div>
          <div
            v-for="df in floatsForUnit(unit.unitId)"
            :key="df.id"
            class="damage-float"
          >-{{ df.text }}</div>
        </div>
      </div>

      <div class="scene-spacer"></div>

      <div class="hero-slot" v-if="heroUnit">
        <div class="battle-unit-wrap">
          <div class="battle-unit hero" :class="unitClasses(heroUnit)">
            <div class="unit-head">
              <span class="unit-name">{{ heroUnit.name }}</span>
              <span class="unit-side">主角</span>
            </div>
            <div class="bar-row">
              <div class="bar-label">
                <span>生命</span>
                <span>{{ fmtBattleHp(heroUnit.hp) }}/{{ heroUnit.maxHp }}</span>
              </div>
              <div class="bar-track">
                <div class="bar-fill hp" :style="{ width: hpPercent(heroUnit) + '%' }"></div>
              </div>
            </div>
            <div class="bar-row">
              <div class="bar-label">
                <span>行动条</span>
                <span>{{ Math.round(heroUnit.actionBar) }}/{{ heroUnit.actionValue }}</span>
              </div>
              <div class="bar-track action-track">
                <div
                  class="bar-fill action"
                  :class="actionBarClasses(heroUnit)"
                  :style="{ width: actionPercent(heroUnit) + '%' }"
                ></div>
              </div>
            </div>
          </div>
          <div
            v-for="df in floatsForUnit(heroUnit.unitId)"
            :key="df.id"
            class="damage-float"
          >-{{ df.text }}</div>
        </div>
      </div>
    </div>

    <div class="battle-speed" v-if="battle && battle.status === 'RUNNING'">
      <span class="battle-speed-label">速度</span>
      <button
        v-for="s in speedOptions"
        :key="s"
        class="btn-speed"
        :class="{ active: battleSpeed === s }"
        :disabled="skipping"
        @click="setSpeed(s)"
      >×{{ s }}</button>
      <button class="btn-skip" :disabled="!canSkip || skipping" @click="skipBattle">跳过</button>
    </div>

    <div class="battle-actions">
      <button v-if="!autoRunning" class="btn-next" :disabled="!canManualAct" @click="nextStep">下一步</button>
      <button
        class="btn-auto"
        :class="{ active: autoRunning }"
        :disabled="battle.status !== 'RUNNING'"
        @click="toggleAuto"
      >
        {{ autoRunning ? '停止自动' : '自动战斗' }}
      </button>
    </div>

    <div class="log-bar" @click="showLogFull = true">
      <div class="log-bar-label">战斗记录 · 点击查看全部</div>
      <div
        v-if="latestLog"
        class="log-bar-line"
        :class="logClass(latestLog.type)"
        v-html="formatLogHtml(latestLog)"
      ></div>
      <div v-else class="log-bar-empty">暂无记录</div>
    </div>
  </template>

  <div v-if="showMonsterDetail" class="monster-detail-mask" @click.self="closeMonsterDetail">
    <div class="monster-detail-panel">
      <div class="monster-detail-head">
        <div>
          <h3>{{ selectedUnit ? selectedUnit.name : '怪物详情' }}</h3>
          <div class="monster-detail-sub" v-if="monsterDetail">{{ monsterDetail.code }}</div>
        </div>
        <button @click="closeMonsterDetail">关闭</button>
      </div>
      <div v-if="monsterDetailLoading" class="monster-detail-loading">加载中...</div>
      <template v-else-if="monsterDetail && selectedUnit">
        <div class="monster-stat-grid">
          <div class="monster-stat-item">
            <span class="label">生命</span>
            <span class="value">{{ fmtBattleHp(selectedUnit.hp) }}/{{ selectedUnit.maxHp }}</span>
          </div>
          <div class="monster-stat-item">
            <span class="label">攻击</span>
            <span class="value">{{ monsterDetail.attack }}</span>
          </div>
          <div class="monster-stat-item">
            <span class="label">行动值</span>
            <span class="value">{{ monsterDetail.actionValue }}</span>
          </div>
        </div>
        <div class="monster-drop-section">
          <div class="monster-drop-title">可能掉落</div>
          <div v-if="!monsterDetail.drops || !monsterDetail.drops.length" class="monster-drop-empty">暂无掉落配置</div>
          <div v-else class="monster-drop-list">
            <div v-for="drop in monsterDetail.drops" :key="drop.itemId" class="monster-drop-row">
              <div class="monster-drop-item">
                <img v-if="itemIconIsImage(drop.icon)" class="monster-drop-icon-img" :src="drop.icon" :alt="drop.itemName">
                <span v-else class="monster-drop-icon">{{ drop.icon || '📦' }}</span>
                <span class="monster-drop-name">{{ drop.itemName }}</span>
              </div>
              <div class="monster-drop-meta">
                <span class="drop-rate">{{ drop.dropRate }}%</span>
                <span class="drop-qty">{{ drop.minQty === drop.maxQty ? drop.minQty : (drop.minQty + '~' + drop.maxQty) }}</span>
              </div>
            </div>
          </div>
          <div class="monster-drop-tip">每种物品独立判定 · 数量越多概率越低</div>
        </div>
      </template>
    </div>
  </div>

  <div v-if="showLogFull" class="log-full-mask" @click.self="showLogFull = false">
    <div class="log-full-panel">
      <div class="log-full-head">
        <h3>战斗记录</h3>
        <button @click="showLogFull = false">关闭</button>
      </div>
      <div class="log-full-body">
        <div
          v-for="(log, idx) in allLogs"
          :key="idx"
          class="log-item"
          :class="logClass(log.type)"
          v-html="formatLogHtml(log)"
        ></div>
        <div v-if="!allLogs.length" class="log-bar-empty">暂无记录</div>
      </div>
    </div>
  </div>

  <div v-if="toast.show" class="toast" :class="toast.type">{{ toast.text }}</div>
</div>

<script src="/js/config.js"></script>
<script src="/js/api.js"></script>
<script src="/js/battle-anim.js"></script>
<script src="/js/battle-log-fmt.js"></script>
<script src="/js/item-icon.js"></script>
<script>
const { createApp } = Vue;

function getQuery(name) {
  var m = location.search.match(new RegExp('[?&]' + name + '=([^&]+)'));
  return m ? decodeURIComponent(m[1]) : '';
}

createApp({
  data() {
    return {
      loading: true,
      battle: null,
      renderUnits: [],
      animating: false,
      actingUnitId: '',
      hitUnitId: '',
      growingUnitIds: [],
      autoRunning: false,
      autoTimer: null,
      battleSpeed: Number(localStorage.getItem('battleSpeed')) || 1,
      speedOptions: [1, 2, 3],
      skipping: false,
      skipAnim: false,
      showLogFull: false,
      showMonsterDetail: false,
      monsterDetailLoading: false,
      monsterDetail: null,
      selectedUnit: null,
      monsterDetailCache: {},
      damageFloats: [],
      toast: { show: false, text: '', type: 'error' }
    };
  },
  computed: {
    visibleUnits() {
      return this.renderUnits.length ? this.renderUnits : (this.battle ? this.battle.units : []);
    },
    heroUnit() {
      return this.visibleUnits.find(function (u) { return u.side === 'HERO'; }) || null;
    },
    monsterUnits() {
      var self = this;
      return this.visibleUnits.filter(function (u) {
        if (u.side !== 'MONSTER') return false;
        if (u.alive) return true;
        return self.animating && Number(u.hp) > 0;
      });
    },
    monsterLayoutCount() {
      var count = this.monsterUnits.length;
      if (count < 1) return 1;
      if (count > 5) return 5;
      return count;
    },
    canManualAct() {
      return this.battle && this.battle.status === 'RUNNING' && !this.loading && !this.animating && !this.autoRunning;
    },
    canAct() {
      return this.battle && this.battle.status === 'RUNNING' && !this.loading && !this.animating;
    },
    canSkip() {
      return this.battle && this.battle.status === 'RUNNING' && !this.loading;
    },
    autoStepDelay() {
      var speed = this.battleSpeed || 1;
      return Math.max(40, Math.round(240 / speed));
    },
    statusText() {
      if (!this.battle) return '';
      if (this.animating) return '进行中';
      if (this.battle.status === 'WIN') return '胜利';
      if (this.battle.status === 'LOSE') return '失败';
      return '进行中';
    },
    latestLog() {
      if (!this.battle || !this.battle.logs || !this.battle.logs.length) return null;
      return this.battle.logs[this.battle.logs.length - 1];
    },
    allLogs() {
      if (!this.battle || !this.battle.logs) return [];
      return this.battle.logs.slice().reverse();
    },
    lootList() {
      if (!this.battle || !this.battle.lootAccumulated) return [];
      return this.battle.lootAccumulated;
    }
  },
  mounted() {
    if (!GameApi.getToken()) {
      location.href = APP_CONFIG.loginPage;
      return;
    }
    var stageId = getQuery('stageId') || localStorage.getItem(APP_CONFIG.selectedStageKey);
    if (!stageId) {
      this.showToast('请先选择关卡');
      setTimeout(function () { location.href = APP_CONFIG.homePage; }, 1200);
      return;
    }
    this.startBattle(stageId);
  },
  beforeUnmount() {
    this.stopAuto();
  },
  methods: {
    fmtBattleHp: function (hp) {
      if (hp == null || hp === '') return '0';
      var n = Number(hp);
      if (!isFinite(n)) return String(hp);
      if (Math.abs(n - Math.round(n)) < 0.0001) return String(Math.round(n));
      return n.toFixed(1);
    },
    itemIconIsImage(icon) {
      return ItemIcon.isImage(icon);
    },
    showToast(text, type) {
      this.toast = { show: true, text: text, type: type || 'error' };
      var self = this;
      setTimeout(function () { self.toast.show = false; }, 2200);
    },
    unitClasses(unit) {
      return {
        dead: !unit.alive || Number(unit.hp) <= 0,
        acting: this.actingUnitId === unit.unitId,
        hit: this.hitUnitId === unit.unitId
      };
    },
    actionBarClasses(unit) {
      return {
        growing: unit.alive && this.growingUnitIds.indexOf(unit.unitId) >= 0,
        ready: this.actingUnitId === unit.unitId
      };
    },
    hpPercent(unit) {
      if (!unit.maxHp) return 0;
      return Math.max(0, Math.min(100, unit.hp / unit.maxHp * 100));
    },
    actionPercent(unit) {
      if (!unit.actionValue) return 0;
      return Math.max(0, Math.min(100, unit.actionBar / unit.actionValue * 100));
    },
    logClass(type) {
      if (type === 'WAVE') return 'wave';
      if (type === 'ACTION') return 'action';
      if (type === 'RESULT') return 'result';
      if (type === 'LOOT') return 'loot';
      return '';
    },
    formatLogHtml(log) {
      return BattleLogFmt.html(log);
    },
    floatsForUnit(unitId) {
      return this.damageFloats.filter(function (f) { return f.unitId === unitId; });
    },
    spawnDamageFloat(unitId, damage) {
      var id = 'df-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
      this.damageFloats.push({ id: id, unitId: unitId, text: String(damage) });
      var self = this;
      setTimeout(function () {
        self.damageFloats = self.damageFloats.filter(function (f) { return f.id !== id; });
      }, 900);
    },
    applyBattle(data, animateFrom) {
      var self = this;
      if (!animateFrom || self.skipAnim) {
        self.battle = data;
        self.renderUnits = (data.units || []).map(function (u) { return Object.assign({}, u); });
        self.animating = false;
        self.actingUnitId = '';
        self.hitUnitId = '';
        self.growingUnitIds = [];
        return Promise.resolve();
      }
      return BattleAnim.playStep(self, animateFrom, data);
    },
    startBattle(stageId) {
      var self = this;
      self.loading = true;
      GameApi.battleStart(stageId)
        .then(function (res) {
          return self.applyBattle(res.data, null);
        })
        .catch(function (err) {
          self.showToast(err.message);
          setTimeout(function () { location.href = APP_CONFIG.homePage; }, 1200);
        })
        .finally(function () {
          self.loading = false;
        });
    },
    nextStep() {
      if (!this.battle || this.battle.status !== 'RUNNING' || this.loading || this.animating) return;
      if (!this.skipping && !this.autoRunning && !this.canManualAct()) return;
      var self = this;
      var snapshot = JSON.parse(JSON.stringify(self.battle));
      self.loading = true;
      GameApi.battleNext(self.battle.battleId)
        .then(function (res) {
          return self.applyBattle(res.data, snapshot);
        })
        .catch(function (err) {
          self.showToast(err.message);
          self.stopAuto();
          self.skipping = false;
          self.skipAnim = false;
        })
        .finally(function () {
          self.loading = false;
          if (self.battle && self.battle.status !== 'RUNNING') {
            self.stopAuto();
            self.skipping = false;
            self.skipAnim = false;
          } else if (self.skipping) {
            self.runSkipLoop();
          } else if (self.autoRunning) {
            self.scheduleAutoStep();
          }
        });
    },
    setSpeed(speed) {
      this.battleSpeed = speed;
      localStorage.setItem('battleSpeed', String(speed));
      if (this.autoRunning) {
        this.scheduleAutoStep();
      }
    },
    skipBattle() {
      if (!this.canSkip || this.skipping) return;
      this.skipping = true;
      this.skipAnim = true;
      this.stopAuto();
      this.runSkipLoop();
    },
    runSkipLoop() {
      var self = this;
      if (!self.skipping || !self.battle || self.battle.status !== 'RUNNING') {
        self.skipping = false;
        self.skipAnim = false;
        return;
      }
      if (self.loading || self.animating) {
        setTimeout(function () { self.runSkipLoop(); }, 16);
        return;
      }
      self.nextStep();
    },
    scheduleAutoStep() {
      var self = this;
      if (!self.autoRunning) return;
      if (self.autoTimer) {
        clearTimeout(self.autoTimer);
      }
      self.autoTimer = setTimeout(function () {
        self.autoTimer = null;
        if (!self.autoRunning) return;
        if (!self.battle || self.battle.status !== 'RUNNING') {
          self.stopAuto();
          return;
        }
        if (self.canAct) {
          self.nextStep();
        } else {
          self.scheduleAutoStep();
        }
      }, self.autoStepDelay);
    },
    toggleAuto() {
      if (this.autoRunning) {
        this.stopAuto();
        return;
      }
      if (!this.battle || this.battle.status !== 'RUNNING') return;
      this.autoRunning = true;
      this.scheduleAutoStep();
    },
    stopAuto() {
      this.autoRunning = false;
      if (this.autoTimer) {
        clearTimeout(this.autoTimer);
        this.autoTimer = null;
      }
    },
    goHome() {
      this.stopAuto();
      location.href = APP_CONFIG.homePage;
    },
    openMonsterDetail(unit) {
      if (!unit || !unit.monsterId) {
        this.showToast('无法查看该单位详情');
        return;
      }
      var self = this;
      self.selectedUnit = unit;
      self.showMonsterDetail = true;
      var cached = self.monsterDetailCache[unit.monsterId];
      if (cached) {
        self.monsterDetail = cached;
        self.monsterDetailLoading = false;
        return;
      }
      self.monsterDetailLoading = true;
      self.monsterDetail = null;
      GameApi.getMonsterDetail(unit.monsterId)
        .then(function (res) {
          self.monsterDetail = res.data;
          self.monsterDetailCache[unit.monsterId] = res.data;
        })
        .catch(function (err) {
          self.showToast(err.message);
          self.showMonsterDetail = false;
        })
        .finally(function () {
          self.monsterDetailLoading = false;
        });
    },
    closeMonsterDetail() {
      this.showMonsterDetail = false;
      this.monsterDetailLoading = false;
    }
  }
}).mount('#app');
</script>
</body>
</html>
